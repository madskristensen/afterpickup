name: Optimize images

on:
  push:
    paths:
      - "assets/images/**"
      - "_posts/**"
      - "_queue/**"
      - "about.md"
      - ".github/scripts/resize_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resize:
    # This job commits back into assets/images, which is one of the paths
    # that triggers it. Skipping our own bot stops the loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate variants and optimize
        run: python3 .github/scripts/resize_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Covers generated variants under posts/ and the losslessly
          # optimized PNGs that sit at the root of assets/images.
          git add -A assets/images _data/image_variants.yml
          if git diff --cached --quiet; then
            echo "Nothing to do."
            exit 0
          fi
          git commit -m "Regenerate and optimize images"
          git push
