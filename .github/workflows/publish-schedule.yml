name: Publish from queue

on:
  schedule:
    - cron: "0 14 * * 1,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the oldest queued post into _posts
        id: publish
        run: python3 .github/scripts/publish_from_queue.py

      - name: Commit and push
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _posts _queue
          git commit -m "Publish ${{ steps.publish.outputs.slug }}"
          git push
