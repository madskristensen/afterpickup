name: Publish from queue

on:
  schedule:
    - cron: "17 5 * * 1,3"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the oldest queued post into _posts
        id: publish
        run: python3 .github/scripts/publish_from_queue.py

      - name: Commit and push
        id: commit
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _posts _queue
          git commit -m "Publish ${{ steps.publish.outputs.slug }}"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/jekyll.yml
    with:
      checkout_ref: ${{ needs.publish.outputs.commit_sha }}
    secrets: inherit
