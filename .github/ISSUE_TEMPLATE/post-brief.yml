name: Post brief
description: A brief for one After Pickup post.
title: "[Post] "
labels: ["draft"]
body:
  - type: input
    id: working-title
    attributes:
      label: Working title
      placeholder: The 4pm hallway reset
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong, and when.
    validations:
      required: true

  - type: textarea
    id: what-we-do
    attributes:
      label: What we do at home
      description: The system as we actually run it.
    validations:
      required: true

  - type: textarea
    id: age-split
    attributes:
      label: The 5 / 8 / 10 split
      description: What each kid does differently.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The sequence, in order.
    validations:
      required: true

  - type: textarea
    id: what-failed
    attributes:
      label: What failed
      description: What we tried first and why it did not hold.
    validations:
      required: true

  - type: textarea
    id: gear
    attributes:
      label: Gear
      description: Optional. Only real things we own.

  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Optional. Shots we already have or can take.

  - type: textarea
    id: do-not-invent
    attributes:
      label: Do not invent
      description: Optional. Facts that must not be guessed at.
