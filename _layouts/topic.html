---
layout: default
---
<article class="topic">
  <h1>{{ page.title }}</h1>
  {%- if page.intro %}
  <p class="topic-intro">{{ page.intro }}</p>
  {%- endif %}
  {%- include topic-guides.html -%}

  {%- if page.topic_posts.size == 0 %}
  <p>Nothing in this topic yet.</p>
  {%- else %}
  {%- include post-cards.html posts=page.topic_posts -%}
  {%- endif %}
</article>
