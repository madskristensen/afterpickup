<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EC">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    {%- seo -%}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Source+Sans+3:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {%- feed_meta -%}
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-top">
        {%- if page.url == "/" %}
        <h1 class="wordmark-h1"><a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        {%- else %}
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {%- endif %}
        <nav class="site-nav">
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
      {%- if site.tagline %}
      <p class="tagline">{{ site.tagline }}</p>
      {%- endif %}
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </footer>
  </body>
</html>
