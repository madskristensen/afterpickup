---
layout: default
---
<article class="post">
  {% include hero.html %}

  <h1>{{ page.title }}</h1>
  {%- if page.date %}
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  {%- endif %}

  <div class="prose">
    {{ content }}
  </div>

  {%- if page.tags and page.tags != empty %}
  <p class="tags">
    {%- for tag in page.tags %}<a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% endfor -%}
  </p>
  {%- endif %}
</article>
