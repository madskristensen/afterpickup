{%- if page.year or page.week -%}
<nav class="redmond-crumbs" aria-label="Breadcrumb">
  <ol>
    <li>
      <a href="{{ '/redmond/' | relative_url }}">Redmond</a>
    </li>
    {%- if page.year %}
    <li>
      {%- if page.week -%}
      <a href="{{ '/redmond/' | append: page.year | append: '/' | relative_url }}">{{ page.year }}</a>
      {%- else -%}
      <span aria-current="page">{{ page.year }}</span>
      {%- endif -%}
    </li>
    {%- endif %}
    {%- if page.week %}
    <li><span aria-current="page">{{ page.dates | default: page.range }}</span></li>
    {%- endif %}
  </ol>
</nav>
{%- endif -%}
