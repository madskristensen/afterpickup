{%- if page.image %}
<figure class="hero">
  <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}" width="1600" height="900" fetchpriority="high" decoding="async">
  {%- if page.image_caption %}
  <figcaption>{{ page.image_caption }}</figcaption>
  {%- endif %}
</figure>
{%- endif %}
