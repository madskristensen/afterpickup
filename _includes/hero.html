{%- if page.image %}
{%- assign hero_alt = page.image_alt | default: page.title -%}
<figure class="hero">
  {%- include responsive-img.html
       src=page.image
       alt=hero_alt
       priority="high"
       sizes="(min-width: 62.5rem) 60rem, 100vw" -%}
  {%- if page.image_caption %}
  <figcaption>{{ page.image_caption }}</figcaption>
  {%- endif %}
</figure>
{%- endif %}
