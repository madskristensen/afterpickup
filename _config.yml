title: After Pickup
tagline: What actually works between pickup and lights-out.
description: >-
  Tested, calm systems for the hour after school pickup.
url: https://www.afterpickup.com
baseurl: ""
logo: /assets/images/logo.svg
image_alt: After Pickup, what actually works between pickup and lights-out.
lang: en-US

author:
  name: Caitlin and Mads
  url: https://www.afterpickup.com/about/
  twitter: madskristensen
twitter:
  username: madskristensen
  card: summary_large_image
social:
  name: After Pickup
  links:
    - https://twitter.com/madskristensen

permalink: /:title/
timezone: America/Chicago

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _queue
  - .vs
