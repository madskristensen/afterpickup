title: After Pickup
tagline: Tips and tricks for home and family.
description: >-
  Tested, calm systems for the hour after school pickup.
url: https://www.afterpickup.com
baseurl: ""
logo: /assets/images/logo.svg
image_alt: After Pickup, tips and tricks for home and family.
lang: en-US

author:
  name: Caitlin and Mads
  url: https://www.afterpickup.com/about/
  twitter: madskristensen
twitter:
  username: madskristensen
  card: summary_large_image
social:
  name: After Pickup
  links:
    - https://twitter.com/madskristensen

permalink: /:title/
timezone: America/Chicago
# Coming Redmond weeks are dated on their Monday, which can be ahead of
# today. Without this, Jekyll hides those collection pages.
future: true

collections:
  redmond:
    output: true

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: redmond
    values:
      layout: redmond

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _queue
  - .vs
