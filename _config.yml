title: After Pickup
tagline: What actually works between pickup and lights-out.
description: >-
  Tested, calm systems for the hour after school pickup.
url: https://afterpickup.com
baseurl: ""
logo: /assets/images/logo.png
lang: en-US

permalink: /:title/
timezone: America/Chicago

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - _queue
  - .vs
