# Topic hubs. Each hub lists every published post whose `clusters`
# front matter includes the hub id, plus the published slugs under
# `posts` (posts that were live before the hubs existed, listed here so
# their files and git dates stay untouched). New posts only need
# `clusters: [id]` in their front matter. _queue/ is excluded from the
# build, so queued posts show up only once they publish.
